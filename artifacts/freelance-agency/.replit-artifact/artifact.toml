kind = "web"
previewPath = "/"
title = "Freelance Web Agency"
version = "1.0.0"
id = "artifacts/freelance-agency"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23452

[services.development]
run = "pnpm --filter @workspace/freelance-agency run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/freelance-agency", "run", "build" ]
publicDir = "artifacts/freelance-agency/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23452"
BASE_PATH = "/"
